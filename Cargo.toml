[workspace]
resolver = "3"
members = ["crates/tweaker-core", "crates/tweaker-windows", "crates/tweaker-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tweaker-core = { path = "crates/tweaker-core" }
tweaker-windows = { path = "crates/tweaker-windows" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
